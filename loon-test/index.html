<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loon 自检面板 V2.1</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:920px;margin:0 auto;padding:22px;line-height:1.55;background:#f6f7f9;color:#111}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 12px rgba(0,0,0,.06)}h1{font-size:28px;margin-bottom:6px}.btn{width:100%;box-sizing:border-box;border:1px solid #ddd;background:#fff;border-radius:12px;padding:13px;margin:6px 0;font-size:15px}.primary{font-weight:700}.ok{color:#087f23}.bad{color:#b42318}.muted{color:#666;font-size:14px}.tag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f1f3f5;border-radius:7px;padding:2px 6px}.row{padding:6px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}</style></head><body><h1>Loon 自检面板 V2.1</h1><p class="muted">先在 Loon 开始抓包，然后点下面这一个按钮。它会依次测试分流和广告规则；跑完后再等 15 秒再停止抓包。</p><div class="card"><h2>全部测试</h2><button class="btn primary" onclick="runEverything()">一键测试分流 + 广告</button><div id="result"></div></div><div class="card"><h2>Weather</h2><p>当前 iOS 17 天气实测走 <span class="tag">weatherkit.apple.com/v3/weather/…</span>。天气需要单独打开 Apple 天气 App 测，不在网页里伪造。</p></div><script>const routes=[['ChatGPT','https://chatgpt.com/cdn-cgi/trace','JP优先/US备用'],['X','https://x.com/','US'],['Google','https://www.google.com/generate_204','GlobalUS'],['YouTube','https://www.youtube.com/generate_204','YouTube/US'],['NodeSeek','https://www.nodeseek.com/','JP'],['DTC Pay','https://www.dtcpay.com/','SG'],['Kraken','https://www.kraken.com/','UK'],['USYD','https://www.sydney.edu.au/','School AU/US'],['Outlook','https://outlook.office365.com/','School AU/US'],['淘宝','https://www.taobao.com/','DIRECT'],['中银香港','https://www.bochk.com/','DIRECT']];const ads=[['腾讯广告','https://mi.gdt.qq.com/'],['百度广告','https://mobads.baidu.com/'],['Bilibili广告域名','https://api.biliapi.com/'],['Keep广告','https://kad.gotokeep.com/']];const sleep=ms=>new Promise(r=>setTimeout(r,ms));function row(n,t,c=''){return `<div class="row ${c}"><b>${n}</b>：${t}</div>`}async function probe(url,timeout){const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),timeout);const s=Date.now();try{await fetch(url,{mode:'no-cors',cache:'no-store',signal:ctl.signal});clearTimeout(timer);return ['完成',Date.now()-s,true]}catch(e){clearTimeout(timer);return [e.name==='AbortError'?'超时/仍在连接':'失败/被拦截',Date.now()-s,false]}}async function runEverything(){const e=document.getElementById('result');let out='<p><b>分流测试</b></p>';e.innerHTML=out;for(const [n,u,expect] of routes){const [state,ms,ok]=await probe(u,8000);out+=row(n,`${state} · ${ms}ms · 期望 ${expect}`,ok?'ok':'bad');e.innerHTML=out;await sleep(300)}out+='<p><b>广告规则测试</b></p>';e.innerHTML=out;for(const [n,u] of ads){const [state,ms,ok]=await probe(u,5000);out+=row(n,`${state} · ${ms}ms`,ok?'bad':'ok');e.innerHTML=out;await sleep(300)}out+='<p class="muted">网页结果只用于触发请求。最终以 HAR 中 policy/rule 是否命中正确策略、广告是否为 REJECT/REJECT-DROP/REJECT-200 为准。现在请再等 15 秒后停止抓包。</p>';e.innerHTML=out}</script></body></html>
